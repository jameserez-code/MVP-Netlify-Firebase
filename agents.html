<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Agent // Agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          "surface-dim": "#131313", "secondary": "#97deff", "on-surface-variant": "#b9ccb2",
          "primary": "#ebffe2", "surface-container-lowest": "#0e0e0e", "background": "#131313",
          "surface-tint": "#00e639", "surface-container-highest": "#353534",
          "secondary-container": "#00c8fe", "on-surface": "#e5e2e1", "primary-container": "#00ff41",
          "outline-variant": "#3b4b37", "surface-container-low": "#1c1b1b",
          "surface-variant": "#353534", "error": "#ffb4ab", "tertiary-fixed-dim": "#f7be00",
          neon: "#00e639", "neon-dim": "#68d3ff",
        },
        fontFamily: { display: ["Geist","sans-serif"], body: ["Geist","sans-serif"], mono: ["JetBrains Mono","monospace"] },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem" },
      }},
    };
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: "Geist", sans-serif; background: #0e0e0e; color: #e5e2e1; min-height: 100vh; }
    body::after { content: ""; position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,230,57,.03) 50%); background-size: 100% 4px; pointer-events: none; z-index: 9999; }
    .mono { font-family: "JetBrains Mono", monospace !important; }
    @keyframes text-glow { 0%,100%{text-shadow:0 0 4px rgba(0,230,57,.4)} 50%{text-shadow:0 0 10px rgba(0,230,57,.7)} }
    @keyframes slide-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

    .glass-panel { background: rgba(18,18,18,.85); backdrop-filter: blur(16px); border: 1px solid rgba(59,75,55,.3); border-radius: .25rem; }
    .shimmer-bar { background: linear-gradient(90deg, transparent, #00e639, transparent); background-size: 200% 100%; animation: shimmer 3s infinite linear; }
    .btn { padding: 8px 16px; border-radius: .25rem; font-weight: 600; font-size: 12px; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; text-transform: uppercase; letter-spacing: 1px; font-family: "JetBrains Mono", monospace; }
    .btn-primary { background: rgba(0,230,57,.12); color: #00e639; border-color: rgba(0,230,57,.25); }
    .btn-primary:hover { background: rgba(0,230,57,.2); box-shadow: 0 0 20px rgba(0,230,57,.25); }
    .btn-danger { background: rgba(147,0,10,.15); color: #ffb4ab; border-color: rgba(147,0,10,.3); }
    .btn-danger:hover { background: rgba(147,0,10,.25); box-shadow: 0 0 12px rgba(255,180,171,.25); }
    .btn-sm { padding: 4px 12px; font-size: 10px; }
    .input { width: 100%; padding: 8px 12px; background: #1c1b1b; border: 1px solid rgba(59,75,55,.4); border-radius: .25rem; font-size: 13px; color: #e5e2e1; font-family: "JetBrains Mono", monospace; }
    .input:focus { outline: none; border-color: #00e639; box-shadow: 0 0 8px rgba(0,230,57,.15); }
    .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #00e639; margin-bottom: 12px; font-family: "JetBrains Mono", monospace; }
    .section-title::before { content: "// "; color: #555; }
    .status-badge { display: inline-flex; align-items: center; padding: 3px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-family: "JetBrains Mono", monospace; }
    .status-active { background: rgba(0,230,57,.1); color: #00e639; border: 1px solid rgba(0,230,57,.2); }
    .status-revoked { background: rgba(147,0,10,.1); color: #ffb4ab; border: 1px solid rgba(147,0,10,.2); }
    .status-suspended { background: rgba(247,190,0,.1); color: #f7be00; border: 1px solid rgba(247,190,0,.2); }
    .spinner { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <header class="fixed top-0 w-full z-50 flex justify-between items-center px-8 h-16" style="background:rgba(19,19,19,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,75,55,.3);">
    <h1 class="text-sm font-bold uppercase tracking-[4px] mono" style="color:#00e639;animation:text-glow 3s ease-in-out infinite;">Passport Agent // Agents</h1>
    <div class="flex items-center gap-3">
      <span id="apiStatus" class="text-[10px] mono" style="color:rgba(185,204,178,.4);">● disconnected</span>
      <a href="/admin-portal.html" class="text-[10px] mono uppercase tracking-[2px] hover:underline" style="color:rgba(185,204,178,.5);">Admin</a>
      <a href="/index.html" class="text-[10px] mono uppercase tracking-[2px] hover:underline" style="color:rgba(185,204,178,.5);">Main</a>
    </div>
  </header>

  <main class="pt-20 px-8 pb-16 max-w-6xl mx-auto space-y-6">
    <!-- Register Agent -->
    <div class="glass-panel p-6 relative overflow-hidden">
      <div class="shimmer-bar absolute top-0 left-0 w-1/3" style="height:2px;"></div>
      <h2 class="section-title">Register Agent</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <input id="agentName" class="input" placeholder="Agent name" />
        <input id="agentModel" class="input" placeholder="Model (e.g. gpt-4o)" />
        <input id="agentProvider" class="input" placeholder="Provider (e.g. openai)" />
      </div>
      <div class="flex items-center gap-3">
        <button id="registerBtn" class="btn btn-primary" disabled>Register Agent</button>
        <span id="registerResult" class="text-xs mono hidden"></span>
      </div>
    </div>

    <!-- Agent List -->
    <div class="glass-panel p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="section-title mb-0">Active Agents</h2>
        <button id="refreshAgentsBtn" class="btn btn-primary btn-sm">Refresh</button>
      </div>
      <div id="agentList" class="space-y-2"><p class="text-xs mono" style="color:rgba(185,204,178,.4);">Loading agents...</p></div>
    </div>

    <!-- Policy Quick-Create -->
    <div class="glass-panel p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="section-title mb-0">Create Policy</h2>
        <span id="policyCount" class="text-[10px] mono" style="color:rgba(185,204,178,.4);"></span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <input id="policyName" class="input" placeholder="Policy name" />
        <select id="policyAgent" class="input"></select>
      </div>
      <div class="flex flex-wrap gap-2 mb-4" id="toolChips"></div>
      <input id="policyTools" class="input mb-4" placeholder="Allowed tools (comma-separated)" value="lookup_order, check_inventory" />
      <input id="policyDenied" class="input mb-4" placeholder="Denied tools (comma-separated)" value="send_email, delete_record" />
      <button id="createPolicyBtn" class="btn btn-primary">Create Policy</button>
      <span id="policyResult" class="text-xs mono hidden ml-3"></span>
    </div>

    <!-- Enforce Test -->
    <div class="glass-panel p-6">
      <h2 class="section-title">Test Enforcement</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <select id="enforceAgent" class="input"></select>
        <select id="enforceTool" class="input">
          <option value="lookup_order">lookup_order (allowed)</option>
          <option value="send_email">send_email (denied)</option>
          <option value="http_request">http_request</option>
        </select>
        <input id="enforceParams" class="input" placeholder='{"orderId": "123"}' value='{"orderId": "123"}' />
      </div>
      <div class="flex items-center gap-3">
        <button id="enforceBtn" class="btn btn-primary">Run Enforce</button>
        <span id="enforceResult" class="text-xs mono hidden"></span>
      </div>
    </div>
  </main>

  <script src="/public/js/api.js"></script>
  <script>
  (function() {
    var api = window.ApiClient;
    var API_BASE = window.API_BASE || 'http://localhost:3000';

    // Check API connection
    fetch(API_BASE + '/agents').then(function() {
      document.getElementById('apiStatus').innerHTML = '● connected';
      document.getElementById('apiStatus').style.color = '#00e639';
    }).catch(function() {
      document.getElementById('apiStatus').innerHTML = '● disconnected (using localStorage)';
    });

    // Auth
    function ensureAuth() {
      if (!api.getToken()) {
        api.login('admin@acmecorp.com', 'admin').then(function(d) {
          if (d) console.log('API logged in');
        });
      }
    }
    ensureAuth();

    // Register agent
    var agentName = document.getElementById('agentName');
    var agentModel = document.getElementById('agentModel');
    var agentProvider = document.getElementById('agentProvider');
    var registerBtn = document.getElementById('registerBtn');

    function checkRegisterFields() {
      registerBtn.disabled = !agentName.value.trim() || !agentModel.value.trim() || !agentProvider.value.trim();
    }
    agentName.addEventListener('input', checkRegisterFields);
    agentModel.addEventListener('input', checkRegisterFields);
    agentProvider.addEventListener('input', checkRegisterFields);

    registerBtn.addEventListener('click', async function() {
      var result = await api.registerAgent(agentName.value, agentModel.value, agentProvider.value, '');
      var el = document.getElementById('registerResult');
      el.classList.remove('hidden');
      if (result && result.agentId) {
        el.style.color = '#00e639';
        el.textContent = 'Registered: ' + result.agentId + ' | Key: ' + result.secretKeyPrefix + '...';
        agentName.value = ''; agentModel.value = ''; agentProvider.value = '';
        registerBtn.disabled = true;
        loadAgents();
      } else {
        el.style.color = '#ffb4ab';
        el.textContent = 'Failed: ' + ((result && result.error && result.error.message) || 'API unavailable');
      }
    });

    // Load agents
    function loadAgents() {
      var container = document.getElementById('agentList');
      api.getAgents().then(function(agents) {
        if (!agents.length) {
          container.innerHTML = '<p class="text-xs mono" style="color:rgba(185,204,178,.4);">No agents registered. Use the form above.</p>';
          return;
        }
        container.innerHTML = agents.map(function(a) {
          return '<div class="flex items-center justify-between p-3 border-b" style="border-color:rgba(59,75,55,.2);">' +
            '<div class="flex items-center gap-3">' +
            '<span style="color:#00e639;font-family:JetBrains Mono,monospace;">&gt;</span>' +
            '<div>' +
            '<p class="text-xs mono" style="color:#e5e2e1;font-weight:600;">' + a.name + '</p>' +
            '<p class="text-[10px] mono" style="color:rgba(185,204,178,.5);">' + a.model + ' / ' + a.provider + ' / PP: ' + (a.passport?.passportNumber || '?') + '</p>' +
            '</div></div>' +
            '<div class="flex items-center gap-2">' +
            '<span class="status-badge status-' + a.status + '">' + a.status + '</span>' +
            (a.status === 'active' ? '<button class="btn btn-danger btn-sm" onclick="revokeAgent(\'' + a.id + '\')">Revoke</button>' : '') +
            '</div></div>';
        }).join('');

        // Populate dropdowns
        var opts = agents.map(function(a) { return '<option value="' + a.id + '">' + a.name + '</option>'; }).join('');
        document.getElementById('policyAgent').innerHTML = opts;
        document.getElementById('enforceAgent').innerHTML = opts;
      });
    }

    window.revokeAgent = async function(id) {
      var result = await api.revokeAgent(id);
      if (result) loadAgents();
    };

    // Load policies count
    api.getPolicies().then(function(policies) {
      document.getElementById('policyCount').textContent = policies.length + ' policies';
    });

    // Create policy
    document.getElementById('createPolicyBtn').addEventListener('click', async function() {
      var name = document.getElementById('policyName').value;
      var agentId = document.getElementById('policyAgent').value;
      var tools = document.getElementById('policyTools').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      var denied = document.getElementById('policyDenied').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);

      var result = await api.createPolicy(name, {
        allowedTools: tools.map(function(t) { return { toolName: t, parameterConstraints: {} }; }),
        deniedTools: denied,
        allowedDomains: [{ pattern: '*.internal.com', methods: ['GET'] }],
        deniedDomains: ['*.evil.com', '169.254.169.254'],
      }, { agentId: agentId }, 10);

      var el = document.getElementById('policyResult');
      el.classList.remove('hidden');
      if (result && result.id) {
        el.style.color = '#00e639';
        el.textContent = 'Created: ' + result.id;
        api.getPolicies().then(function(p) { document.getElementById('policyCount').textContent = p.length + ' policies'; });
      } else {
        el.style.color = '#ffb4ab';
        el.textContent = 'Failed: ' + (result?.error?.message || 'API unavailable');
      }
    });

    // Enforce test
    document.getElementById('enforceBtn').addEventListener('click', async function() {
      var agentId = document.getElementById('enforceAgent').value;
      var tool = document.getElementById('enforceTool').value;
      var params = {};
      try { params = JSON.parse(document.getElementById('enforceParams').value); } catch(e) {}

      var token = api.getToken();
      if (!token) { await api.login('admin@acmecorp.com', 'admin'); token = api.getToken(); }

      var res = await fetch(API_BASE + '/enforce', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ intent: { intentId: 'int_ui_' + Date.now(), agentId: agentId, tool: tool, parameters: params } }),
      });
      var data = await res.json();
      var el = document.getElementById('enforceResult');
      el.classList.remove('hidden');
      el.style.color = data.decision === 'allow' ? '#00e639' : data.decision === 'deny' ? '#ffb4ab' : '#f7be00';
      el.textContent = data.decision.toUpperCase() + (data.reason ? ' — ' + data.reason : '') + (data.gatewayTicket ? ' [ticket issued]' : '');
    });

    document.getElementById('refreshAgentsBtn').addEventListener('click', loadAgents);
    loadAgents();
  })();
  </script>
</body>
</html>
