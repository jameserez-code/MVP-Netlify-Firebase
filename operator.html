<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Agent // Operator Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"surface-dim":"#131313","background":"#0e0e0e","on-surface":"#e5e2e1","on-surface-variant":"#b9ccb2",neon:"#00e639",error:"#ffb4ab",amber:"#f7be00",cyan:"#00c8fe"},fontFamily:{mono:["JetBrains Mono","monospace"]}}}}</script>
  <style>
    body{font-family:"Geist",sans-serif;background:#0e0e0e;color:#e5e2e1;min-height:100vh}
    body::after{content:"";position:fixed;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,230,57,.015) 50%);background-size:100% 4px;pointer-events:none;z-index:9999}
    .glass{background:rgba(18,18,18,.85);backdrop-filter:blur(16px);border:1px solid rgba(59,75,55,.3);border-radius:.25rem;padding:16px;margin-bottom:12px}
    .mono{font-family:"JetBrains Mono",monospace !important}
    .dim{color:rgba(185,204,178,.4);font-family:"JetBrains Mono",monospace;font-size:12px}
    .stat{text-align:center;padding:12px;border-left:2px solid}
    .stat-green{border-color:#00e639;background:rgba(0,230,57,.03)}
    .stat-amber{border-color:#f7be00;background:rgba(247,190,0,.03)}
    .stat-red{border-color:#ffb4ab;background:rgba(147,0,10,.03)}
    .stat-cyan{border-color:#00c8fe;background:rgba(0,200,254,.03)}
    .badge{display:inline-block;padding:2px 8px;font-size:10px;font-weight:700;font-family:"JetBrains Mono",monospace;border:1px solid}
    .badge-green{color:#00e639;border-color:rgba(0,230,57,.3);background:rgba(0,230,57,.06)}
    .badge-red{color:#ffb4ab;border-color:rgba(147,0,10,.3);background:rgba(147,0,10,.06)}
    .badge-amber{color:#f7be00;border-color:rgba(247,190,0,.3);background:rgba(247,190,0,.06)}
    .badge-cyan{color:#00c8fe;border-color:rgba(0,200,254,.3);background:rgba(0,200,254,.06)}
    .task-row{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid rgba(59,75,55,.1);font-size:12px}
    .tl-row{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid rgba(59,75,55,.1);font-size:12px}
    .action-btn{padding:2px 10px;font-size:10px;font-family:"JetBrains Mono",monospace;border:1px solid rgba(255,255,255,.15);color:#888;background:transparent;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
    .action-btn:hover{color:#e5e2e1;border-color:rgba(255,255,255,.3)}
    h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:rgba(185,204,178,.5);margin-bottom:8px;font-family:"JetBrains Mono",monospace}
    h2::before{content:"// ";color:#555}
    .banner{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:100;padding:4px 16px;font-size:10px;font-family:"JetBrains Mono",monospace;letter-spacing:2px;text-transform:uppercase;border-radius:0 0 4px 4px}
    .banner-dev{background:rgba(0,230,57,.1);color:#00e639;border:1px solid rgba(0,230,57,.3);border-top:none}
  </style>
</head>
<body>
  <div class="banner banner-dev" id="envBanner">DEVELOPMENT</div>

  <header style="background:rgba(19,19,19,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,75,55,.3);position:fixed;top:0;width:100%;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:0 32px;height:56px;">
    <h1 class="mono" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#00e639;">Operator Console</h1>
    <div class="flex items-center gap-3">
      <span id="authStatus" class="mono" style="font-size:10px;"></span>
      <button class="action-btn" onclick="location.reload()">Refresh</button>
      <span id="lastRefresh" class="mono dim" style="font-size:10px;"></span>
    </div>
  </header>

  <main style="padding-top:72px;padding:72px 32px 32px;max-width:1200px;margin:0 auto;">
    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;">
      <div class="glass stat stat-green"><div class="mono dim">Tasks</div><div id="tasksTotal" class="mono" style="font-size:24px;font-weight:700;color:#00e639;">—</div></div>
      <div class="glass stat stat-amber"><div class="mono dim">Pending</div><div id="tasksPending" class="mono" style="font-size:24px;font-weight:700;color:#f7be00;">—</div></div>
      <div class="glass stat stat-cyan"><div class="mono dim">Active</div><div id="tasksActive" class="mono" style="font-size:24px;font-weight:700;color:#00c8fe;">—</div></div>
      <div class="glass stat stat-red"><div class="mono dim">Failed</div><div id="tasksFailed" class="mono" style="font-size:24px;font-weight:700;color:#ffb4ab;">—</div></div>
      <div class="glass stat stat-green"><div class="mono dim">Active Runs</div><div id="runsActive" class="mono" style="font-size:24px;font-weight:700;color:#00e639;">—</div></div>
      <div class="glass stat stat-cyan"><div class="mono dim">Avg Duration</div><div id="avgDuration" class="mono" style="font-size:24px;font-weight:700;color:#00c8fe;">—</div></div>
    </div>

    <!-- Pending queue -->
    <div class="glass">
      <h2>Pending Queue</h2>
      <div id="pendingTasks"><div class="dim">Loading...</div></div>
    </div>

    <!-- Active runs -->
    <div class="glass">
      <h2>Active Runs</h2>
      <div id="activeRuns"><div class="dim">Loading...</div></div>
    </div>

    <!-- Failed tasks -->
    <div class="glass">
      <h2>Failed / Recoverable</h2>
      <div id="failedTasks"><div class="dim">Loading...</div></div>
    </div>

    <!-- Timeline -->
    <div class="glass">
      <h2>Execution Timeline</h2>
      <div id="timeline"><div class="dim">Loading...</div></div>
    </div>
  </main>

  <script src="/public/js/operator.js"></script>
</body>
</html>
