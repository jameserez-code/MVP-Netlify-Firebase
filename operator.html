<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Agent // Operator Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Geist,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;overflow-x:hidden}
    body::after{content:"";position:fixed;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(46,160,67,.008) 50%);background-size:100% 4px;pointer-events:none;z-index:9999}
    :root{--green:#2ea043;--amber:#d2991d;--red:#f85149;--blue:#58a6ff;--muted:#8b949e;--border:rgba(48,54,61,.5);--bg-card:rgba(22,27,34,.7);--bg-hover:rgba(46,160,67,.04)}
    .mono{font-family:"JetBrains Mono",monospace}

    /* Header */
    header{background:rgba(13,17,23,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(46,160,67,.15);position:sticky;top:0;z-index:100;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
    header h1{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:var(--green);text-shadow:0 0 10px rgba(46,160,67,.3)}
    header .nav{display:flex;gap:6px;align-items:center}
    header .nav a{font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-decoration:none;padding:4px 10px;border:1px solid transparent;border-radius:3px;transition:all .15s}
    header .nav a:hover,.nav a.active{color:var(--green);border-color:rgba(46,160,67,.2);background:rgba(46,160,67,.04)}
    header .nav a.active{border-color:rgba(46,160,67,.35)}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(46,160,67,.4);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideRight{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* Grid */
    main{max-width:1200px;margin:0 auto;padding:28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:22px}
    .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:5px;padding:16px 18px;transition:all .2s ease;animation:slideUp .35s ease both}
    .stat-card:hover{transform:translateY(-2px);border-color:rgba(46,160,67,.2);box-shadow:0 6px 18px rgba(0,0,0,.25)}
    .stat-card:nth-child(1){animation-delay:.04s}.stat-card:nth-child(2){animation-delay:.08s}.stat-card:nth-child(3){animation-delay:.12s}.stat-card:nth-child(4){animation-delay:.16s}.stat-card:nth-child(5){animation-delay:.2s}.stat-card:nth-child(6){animation-delay:.24s}
    .stat-label{font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
    .stat-value{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:700}
    .sg{color:var(--green)}.sa{color:var(--amber)}.sr{color:var(--red)}.sb{color:var(--blue)}.sw{color:#c9d1d9}

    /* Sections */
    .section{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;margin-bottom:16px;overflow:hidden;animation:fadeIn .5s ease both}
    .section:nth-child(2){animation-delay:.1s}.section:nth-child(3){animation-delay:.2s}.section:nth-child(4){animation-delay:.3s}.section:nth-child(5){animation-delay:.35s}
    .section-header{padding:14px 20px;border-bottom:1px solid rgba(48,54,61,.3);display:flex;justify-content:space-between;align-items:center;background:rgba(13,17,23,.4)}
    .section-title{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green)}
    .section-title::before{content:"// ";color:#30363d}
    .section-body{padding:14px 20px}

    /* Buttons */
    .btn{font-family:"JetBrains Mono",monospace;font-size:10px;padding:5px 12px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);text-transform:uppercase;letter-spacing:1px;transition:all .2s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn-active{color:var(--green);border-color:rgba(46,160,67,.25);background:rgba(46,160,67,.06)}
    .btn-active:hover{border-color:rgba(46,160,67,.4);box-shadow:0 0 10px rgba(46,160,67,.15);background:rgba(46,160,67,.1)}
    .btn-danger{color:var(--red);border-color:rgba(248,81,73,.15);background:rgba(248,81,73,.04)}
    .btn-danger:hover{border-color:rgba(248,81,73,.3)}

    /* Task rows */
    .task-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid rgba(48,54,61,.12);font-size:12px;font-family:"JetBrains Mono",monospace;animation:slideRight .3s ease both;transition:background .15s}
    .task-row:hover{background:rgba(46,160,67,.03)}
    .task-row:last-child{border-bottom:none}
    .task-row:nth-child(1){animation-delay:.05s}.task-row:nth-child(2){animation-delay:.1s}.task-row:nth-child(3){animation-delay:.15s}.task-row:nth-child(4){animation-delay:.2s}.task-row:nth-child(5){animation-delay:.25s}.task-row:nth-child(6){animation-delay:.3s}
    .badge{display:inline-block;padding:2px 8px;font-size:9px;font-weight:700;font-family:"JetBrains Mono",monospace;border:1px solid;border-radius:2px;letter-spacing:1px;text-transform:uppercase}
    .badge-green{color:var(--green);border-color:rgba(46,160,67,.2);background:rgba(46,160,67,.04)}
    .badge-amber{color:var(--amber);border-color:rgba(210,153,29,.2);background:rgba(210,153,29,.04)}
    .badge-red{color:var(--red);border-color:rgba(248,81,73,.2);background:rgba(248,81,73,.04)}
    .badge-blue{color:var(--blue);border-color:rgba(88,166,255,.2);background:rgba(88,166,255,.04)}
    .dim{color:var(--muted);font-size:11px}

    /* Timeline */
    .tl-row{display:flex;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid rgba(48,54,61,.1);font-size:12px;font-family:"JetBrains Mono",monospace;transition:background .15s}
    .tl-row:hover{background:rgba(46,160,67,.02)}
    .tl-row:last-child{border-bottom:none}
    .tl-time{min-width:52px;color:#484f58;font-size:10px}

    /* Loading */
    .loading{color:var(--muted);font-size:12px;font-family:"JetBrains Mono",monospace;padding:20px;text-align:center}
    .loading::before{content:"> ";color:var(--green);animation:blink 1.2s step-end infinite}
    @keyframes blink{50%{opacity:0}}

    /* Footer */
    .refresh-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:rgba(13,17,23,.3);font-family:"JetBrains Mono",monospace;font-size:10px;color:#30363d}
    @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:11px}header .nav a{font-size:8px;padding:3px 6px}main{padding:16px 10px}}
  </style>
</head>
<body>
  <div style="position:fixed;top:0;left:0;width:100%;height:2px;z-index:200;background:linear-gradient(90deg,transparent,#2ea043,transparent);background-size:200% 100%;animation:shimmer 3s infinite linear"></div>
  <header>
    <h1>Operator Console</h1>
    <div class="nav">
      <a href="/">Dashboard</a>
      <a href="/operator.html" class="active">Console</a>
      <a href="/agents.html">Agents</a>
      <a href="/admin-portal.html">Admin</a>
      <span class="status-dot" id="apiDot" title="API status"></span>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div class="grid" id="statsGrid"></div>

    <!-- Pending Queue -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">Pending Queue</span>
        <div>
          <button class="btn btn-active" onclick="seedDemo()">+ Seed Demos</button>
        </div>
      </div>
      <div class="section-body" id="pendingList"><div class="loading">loading</div></div>
      <div class="refresh-bar"><span id="pendingCount">0 pending</span><span id="lastRefresh">—</span></div>
    </div>

    <!-- Active + Failed (2-col) -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="section" style="margin-bottom:0">
        <div class="section-header"><span class="section-title">Active Runs</span></div>
        <div class="section-body" id="activeRuns"><div class="loading">loading</div></div>
      </div>
      <div class="section" style="margin-bottom:0">
        <div class="section-header"><span class="section-title">Failed / Recoverable</span></div>
        <div class="section-body" id="failedTasks"><div class="loading">loading</div></div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="section" style="margin-top:16px">
      <div class="section-header"><span class="section-title">Execution Timeline</span></div>
      <div class="section-body" id="timeline"><div class="loading">loading</div></div>
    </div>
  </main>

  <script>
    var API = 'http://localhost:3000';
    var token = '';

    async function login() {
      try {
        // Read from input fields or prompts (never hardcode credentials)
        var emailEl = document.getElementById('loginEmail');
        var passEl = document.getElementById('loginPassword');
        var email = emailEl && emailEl.value ? emailEl.value : (window.prompt('Email:', 'admin@acmecorp.com') || '');
        var password = passEl && passEl.value ? passEl.value : (window.prompt('Password:') || '');
        if (!email || !password) return false;
        var r = await fetch(API+'/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
        var d = await r.json();
        if (d.token) { token = d.token; return true; }
      } catch(e) {}
      return false;
    }

    async function api(path, opts) {
      opts = opts || {};
      if (token) opts.headers = Object.assign({Authorization:'Bearer '+token}, opts.headers||{});
      opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
      try { var r = await fetch(API+path, opts); return await r.json(); }
      catch(e) { return null; }
    }

    function seedDemo() {
      for (var i = 0; i < 3; i++) {
        api('/task', {method:'POST',body:JSON.stringify({payload:{description:'Demo task '+(i+1),type:['order','inventory','query'][i]}})});
      }
      setTimeout(refresh, 600);
    }

    async function retryTask(id) {
      var agents = await api('/agents');
      var agentId = agents && agents.data && agents.data[0] ? agents.data[0].id : 'agent_seed_001';
      await api('/agent/run', {method:'POST',body:JSON.stringify({agentId:agentId,taskId:id})});
      setTimeout(refresh, 500);
    }

    async function replayTask(id) {
      var t = await api('/task/'+id);
      if (t && t.payload) {
        var nt = await api('/task', {method:'POST',body:JSON.stringify({payload:t.payload})});
        if (nt && nt.id) retryTask(nt.id);
      }
    }

    async function refresh() {
      document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();

      var m = await api('/metrics');
      if (m && !m.error) {
        var t = m.tasks || {};
        document.getElementById('statsGrid').innerHTML =
          '<div class="stat-card"><div class="stat-label">Tasks</div><div class="stat-value sg">'+t.total+'</div></div>'+
          '<div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value sa">'+t.pending+'</div></div>'+
          '<div class="stat-card"><div class="stat-label">Active</div><div class="stat-value sb">'+t.active+'</div></div>'+
          '<div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value sr">'+t.failed+'</div></div>'+
          '<div class="stat-card"><div class="stat-label">Runs Active</div><div class="stat-value sw">'+(m.runs?m.runs.active:0)+'</div></div>'+
          '<div class="stat-card"><div class="stat-label">Avg Duration</div><div class="stat-value sw">'+(m.avgDurationMs||0)+'ms</div></div>';
        document.getElementById('apiDot').style.background = '#2ea043';
      } else {
        document.getElementById('apiDot').style.background = '#f85149';
      }

      // Pending
      var tasks = await api('/audit?limit=80');
      var pending = tasks && tasks.data ? tasks.data.filter(function(t){return t.status==='pending'||t.status==='queued'}) : [];
      document.getElementById('pendingCount').textContent = pending.length + ' pending';
      document.getElementById('pendingList').innerHTML = pending.length === 0
        ? '<div class="dim" style="text-align:center;padding:12px">No pending tasks. <a href="#" onclick="seedDemo();return false" style="color:var(--green);text-decoration:none;">Seed demo tasks</a>.</div>'
        : pending.slice(0,6).map(function(t){
            return '<div class="task-row"><span class="dim" style="min-width:70px">'+(t.taskId||t.id||'').substring(0,10)+'</span><span class="badge badge-amber">'+(t.status||'pending')+'</span><span class="dim" style="flex:1">'+(t.payload&&t.payload.description||t.payload&&t.payload.type||'—')+'</span><button class="btn btn-active" onclick="retryTask(\''+(t.taskId||t.id)+'\')">&#9654; Run</button></div>';
          }).join('');

      // Active runs
      document.getElementById('activeRuns').innerHTML = m && m.runs && m.runs.active > 0
        ? '<div class="dim" style="text-align:center;padding:12px"><span class="badge badge-green">'+m.runs.active+' active</span> — check timeline below</div>'
        : '<div class="dim" style="text-align:center;padding:12px">No active runs</div>';

      // Failed
      var failed = tasks && tasks.data ? tasks.data.filter(function(t){return t.status==='failed'}) : [];
      document.getElementById('failedTasks').innerHTML = failed.length === 0
        ? '<div class="dim" style="text-align:center;padding:12px">No failures</div>'
        : failed.slice(0,5).map(function(t){
            return '<div class="task-row"><span class="dim" style="min-width:70px">'+(t.taskId||t.id||'').substring(0,10)+'</span><span class="badge badge-red">failed</span><span class="dim" style="flex:1">'+(t.error||'—')+'</span><button class="btn btn-active" onclick="replayTask(\''+(t.taskId||t.id)+'\')">&#8635; Replay</button></div>';
          }).join('');

      // Timeline
      var tl = await api('/audit/timeline?limit=10');
      document.getElementById('timeline').innerHTML = tl && tl.timeline && tl.timeline.length
        ? tl.timeline.slice(0,8).map(function(e){
            var s = Math.round((Date.now()-new Date(e.timestamp).getTime())/1000);
            var cls = e.decision==='allow'?'badge-green':e.decision==='deny'?'badge-red':'badge-blue';
            return '<div class="tl-row"><span class="tl-time">-'+(s<60?s+'s':Math.round(s/60)+'m')+'</span><span class="badge '+cls+'">'+((e.tool||'transition').substring(0,14))+'</span><span class="dim" style="flex:1">'+(e.reason||e.decision||'')+'</span></div>';
          }).join('')
        : '<div class="dim" style="text-align:center;padding:12px">No events yet — run some tasks first</div>';
    }

    login().then(refresh);
    setInterval(refresh, 6000);
  </script>
</body>
</html>
