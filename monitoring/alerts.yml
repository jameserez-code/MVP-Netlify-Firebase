groups:
  - name: passport-agent
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 1% for more than 2 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is above 500ms for more than 3 minutes"

      - alert: QueueBackingUp
        expr: queue_depth > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue depth exceeded 1000"
          description: "Queue depth has been above 1000 for more than 5 minutes"

      - alert: MemoryHigh
        expr: nodejs_memory_heap_used_bytes / nodejs_memory_heap_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Heap memory usage is above 90% for more than 5 minutes"

      - alert: FirebaseDisconnected
        expr: up{job="passport-agent"} == 1 and firebase_connected == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Firebase disconnected"
          description: "Passport Agent cannot connect to Firestore"
