<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Agent // Admin Console</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            neon:  "#00ff41",
            "neon-dim": "#00cc33",
            void:  "#0a0a0a",
            surface: "#16161e",
            border: "#222233",
            muted: "#6b7280",
            error: "#ff4444",
            success: "#00ff41",
          },
          fontFamily: { sans: ["JetBrains Mono", "monospace"], mono: ["JetBrains Mono", "monospace"] },
        },
      },
    };
  </script>

  <style>
    * { font-family: "JetBrains Mono", monospace; }
    body {
      background: #0a0a0a;
      color: #c0c0cc;
      min-height: 100vh;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,.015) 2px, rgba(0,255,65,.015) 3px);
      pointer-events: none;
      z-index: 9999;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 4px rgba(0,255,65,.2); }
      50%      { box-shadow: 0 0 8px rgba(0,255,65,.35); }
    }
    @keyframes text-glow {
      0%, 100% { text-shadow: 0 0 4px rgba(0,255,65,.4); }
      50%      { text-shadow: 0 0 10px rgba(0,255,65,.7); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .card {
      background: #111118;
      border: 1px solid #222233;
      border-radius: 4px;
      padding: 20px;
    }
    .card:hover { border-color: rgba(0,255,65,.25); }
    .stat-card {
      background: #111118;
      border: 1px solid #222233;
      border-radius: 4px;
      padding: 20px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: "JetBrains Mono", monospace;
    }
    .btn-primary {
      background: rgba(0,255,65,.1);
      color: #00ff41;
      border-color: rgba(0,255,65,.3);
    }
    .btn-primary:hover:not(:disabled) {
      background: rgba(0,255,65,.2);
      box-shadow: 0 0 12px rgba(0,255,65,.25);
    }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; }
    .btn-approve {
      background: rgba(0,255,65,.08);
      color: #00ff41;
      border-color: rgba(0,255,65,.25);
      font-size: 11px;
      padding: 4px 12px;
    }
    .btn-approve:hover {
      background: rgba(0,255,65,.18);
      box-shadow: 0 0 8px rgba(0,255,65,.2);
    }
    .btn-reject {
      background: rgba(255,68,68,.08);
      color: #ff4444;
      border-color: rgba(255,68,68,.25);
      font-size: 11px;
      padding: 4px 12px;
    }
    .btn-reject:hover {
      background: rgba(255,68,68,.18);
      box-shadow: 0 0 8px rgba(255,68,68,.2);
    }
    .btn-danger {
      background: rgba(255,68,68,.1);
      color: #ff4444;
      border-color: rgba(255,68,68,.3);
    }
    .btn-danger:hover {
      background: rgba(255,68,68,.2);
      box-shadow: 0 0 12px rgba(255,68,68,.25);
    }

    .input {
      width: 100%;
      padding: 10px 14px;
      background: #0d0d15;
      border: 1px solid #333;
      border-radius: 3px;
      font-size: 13px;
      color: #c0c0cc;
      font-family: "JetBrains Mono", monospace;
      transition: border-color .15s;
    }
    .input:focus {
      outline: none;
      border-color: #00ff41;
      box-shadow: 0 0 8px rgba(0,255,65,.1);
    }
    .input::placeholder { color: #444; }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ff41;
      margin-bottom: 12px;
      animation: text-glow 3s ease-in-out infinite;
    }
    .section-title::before { content: "// "; color: #444; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-family: "JetBrains Mono", monospace;
    }
    .status-pending {
      background: rgba(255,196,0,.1);
      color: #ffc400;
      border: 1px solid rgba(255,196,0,.2);
    }
    .status-issued {
      background: rgba(0,255,65,.1);
      color: #00ff41;
      border: 1px solid rgba(0,255,65,.2);
    }
    .status-approved {
      background: rgba(0,200,255,.1);
      color: #00c8ff;
      border: 1px solid rgba(0,200,255,.2);
    }
    .status-rejected {
      background: rgba(255,68,68,.1);
      color: #ff4444;
      border: 1px solid rgba(255,68,68,.2);
    }
  </style>
</head>
<body>
  <!-- Gate -->
  <div id="gate" class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,.85);">
    <div class="w-full max-w-sm bg-[#111118] border border-[#222233] p-8" style="box-shadow:0 0 40px rgba(0,255,65,.05);">
      <div class="text-center mb-6">
        <div class="text-neon text-3xl mb-2" style="animation: text-glow 3s ease-in-out infinite;">[#]</div>
        <h2 class="text-sm font-bold uppercase tracking-[4px] text-neon mb-1" style="animation: text-glow 3s ease-in-out infinite;">Admin Console</h2>
        <p class="text-xs text-muted">secure terminal // restricted access</p>
      </div>
      <div class="mb-4">
        <p class="text-[10px] text-muted uppercase tracking-[2px] mb-2">Access Code</p>
        <input id="gateInput" type="password" placeholder="Enter code..." class="input" />
      </div>
      <button id="gateBtn" class="btn btn-primary w-full" disabled>Authenticate</button>
      <p id="gateError" class="text-xs text-error mt-3 text-center hidden">ACCESS DENIED</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <!-- Admin Login -->
    <div id="loginView" class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-sm card" style="animation: glow-pulse 4s ease-in-out infinite;">
        <h2 class="section-title">Admin Sign In</h2>
        <div>
          <label class="block text-[10px] uppercase tracking-[2px] text-muted mb-1">Email</label>
          <input id="loginEmail" type="email" class="input mb-3" placeholder="admin@example.com" required />
          <label class="block text-[10px] uppercase tracking-[2px] text-muted mb-1">Password</label>
          <input id="loginPassword" type="password" class="input mb-4" placeholder="••••••••" required />
          <button id="loginBtn" class="btn btn-primary w-full">Sign In</button>
          <p id="loginError" class="text-xs text-error text-center mt-3 hidden"></p>
        </div>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <header class="bg-[#0d0d15] border-b border-[#222233] sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
          <div>
            <h1 class="text-sm font-bold uppercase tracking-[4px] text-neon" style="animation: text-glow 3s ease-in-out infinite;">Passport Agent // Admin</h1>
            <p id="adminUser" class="text-[10px] text-muted tracking-[2px] mt-0.5"></p>
          </div>
          <div class="flex items-center gap-3">
            <button id="refreshBtn" class="btn btn-primary" style="font-size:11px;padding:6px 14px;">Refresh</button>
            <button id="signOutBtn" class="btn btn-danger" style="font-size:11px;padding:6px 14px;">Sign Out</button>
          </div>
        </div>
      </header>

      <main class="max-w-6xl mx-auto p-6 space-y-6">
        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="stat-card">
            <p class="text-[10px] uppercase tracking-[2px] text-muted mb-2">Total</p>
            <p id="statTotal" class="text-2xl font-bold text-neon">---</p>
          </div>
          <div class="stat-card">
            <p class="text-[10px] uppercase tracking-[2px] text-muted mb-2">Pending</p>
            <p id="statPending" class="text-2xl font-bold text-[#ffc400]">---</p>
          </div>
          <div class="stat-card">
            <p class="text-[10px] uppercase tracking-[2px] text-muted mb-2">Approved</p>
            <p id="statApproved" class="text-2xl font-bold text-[#00c8ff]">---</p>
          </div>
          <div class="stat-card">
            <p class="text-[10px] uppercase tracking-[2px] text-muted mb-2">Rejected</p>
            <p id="statRejected" class="text-2xl font-bold text-error">---</p>
          </div>
        </div>

        <!-- Applications Table -->
        <div class="card">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
            <h3 class="section-title mb-0">Application Registry</h3>
            <div class="flex items-center gap-3">
              <input id="filterInput" class="input" style="width:220px;padding:6px 10px;" placeholder="Filter registry..." />
              <button id="seedBtn" class="btn btn-primary" style="font-size:11px;padding:6px 14px;" title="Populate with demo data">Seed Demo</button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead>
                <tr class="border-b border-[#222233] text-muted text-[10px] uppercase tracking-[2px]">
                  <th class="p-3 text-left">ID</th>
                  <th class="p-3 text-left">User</th>
                  <th class="p-3 text-left">Type</th>
                  <th class="p-3 text-left">Details</th>
                  <th class="p-3 text-left">Status</th>
                  <th class="p-3 text-left">Date</th>
                  <th class="p-3 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="appTableBody">
                <tr><td colspan="7" class="p-6 text-center text-muted">Loading registry...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-[9999] space-y-2" style="max-width:320px;"></div>

  <script>
  (function() {
    const GATE_CODE = "Thegreatwave";

    // ===== Gate =====
    const gate = document.getElementById("gate");
    const gateInput = document.getElementById("gateInput");
    const gateBtn = document.getElementById("gateBtn");
    const gateError = document.getElementById("gateError");
    const app = document.getElementById("app");

    if (document.cookie.split(";").some(c => c.trim().startsWith("admin_gate=true"))) {
      gate.style.display = "none";
      app.classList.remove("hidden");
    }

    gateInput.addEventListener("input", () => { gateBtn.disabled = !gateInput.value; });
    gateBtn.addEventListener("click", () => {
      if (gateInput.value === GATE_CODE) {
        document.cookie = "admin_gate=true; path=/; max-age=" + (365 * 24 * 60 * 60);
        gate.style.display = "none";
        app.classList.remove("hidden");
      } else { gateError.classList.remove("hidden"); }
    });
    gateInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !gateBtn.disabled) gateBtn.click();
    });

    // ===== Auth (localStorage, shared with main app) =====
    let adminUser = JSON.parse(localStorage.getItem("passport_user") || "null");

    const loginView = document.getElementById("loginView");
    const dashboard = document.getElementById("dashboard");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const signOutBtn = document.getElementById("signOutBtn");

    function getUsers() {
      return JSON.parse(localStorage.getItem("passport_users") || "{}");
    }

    loginBtn.addEventListener("click", () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value;
      loginError.classList.add("hidden");

      if (!email || !password) {
        loginError.textContent = "Email and password are required.";
        loginError.classList.remove("hidden");
        return;
      }

      const users = getUsers();
      const stored = users[email];
      if (!stored || stored.password !== password) {
        loginError.textContent = "Invalid credentials.";
        loginError.classList.remove("hidden");
        return;
      }

      adminUser = { email };
      localStorage.setItem("passport_user", JSON.stringify(adminUser));
      showDashboard();
    });

    loginPassword.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });

    function showDashboard() {
      loginView.classList.add("hidden");
      dashboard.classList.remove("hidden");
      document.getElementById("adminUser").textContent = adminUser.email;
      renderAll();
    }

    function logout() {
      localStorage.removeItem("passport_user");
      adminUser = null;
      loginView.classList.remove("hidden");
      dashboard.classList.add("hidden");
      loginEmail.value = "";
      loginPassword.value = "";
    }

    signOutBtn.addEventListener("click", logout);

    if (adminUser) showDashboard();

    // ===== Toast System =====
    function showToast(message, type) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      const colors = {
        success: "border-[#00ff41] text-neon",
        error: "border-[#ff4444] text-error",
        info: "border-[#00c8ff] text-[#00c8ff]",
      };
      toast.className = `bg-[#111118] border ${colors[type] || colors.info} px-4 py-3 text-xs font-mono`;
      toast.style.cssText = "animation: slideIn .2s ease;";
      toast.textContent = (type === "success" ? "OK: " : type === "error" ? "ERR: " : "") + message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity .3s";
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ===== Data =====
    function getApps() {
      return JSON.parse(localStorage.getItem("passport_apps") || "[]");
    }
    function saveApps(apps) {
      localStorage.setItem("passport_apps", JSON.stringify(apps));
    }

    // ===== Demo Data Seeder =====
    function seedDemoData() {
      const now = Date.now();
      const demoApps = [
        { id: "visa_seed_001", uid: "alice@agency.io", type: "visa", status: "pending", scopes: ["api:read", "api:write"], createdAt: new Date(now - 1800000).toISOString(), updatedAt: new Date(now - 1800000).toISOString() },
        { id: "visa_seed_002", uid: "bob@agency.io", type: "visa", status: "approved", scopes: ["api:read", "data:share", "config:view"], createdAt: new Date(now - 7200000).toISOString(), updatedAt: new Date(now - 3600000).toISOString() },
        { id: "pprt_seed_001", uid: "carol@agency.io", type: "passport", status: "pending", fullName: "Carol Danvers", passportNumber: "PS891234", createdAt: new Date(now - 5400000).toISOString(), updatedAt: new Date(now - 5400000).toISOString() },
        { id: "pprt_seed_002", uid: "dave@agency.io", type: "passport", status: "issued", fullName: "Dave Chen", passportNumber: "PS456789", token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJkYXZlIiwiYXBwIjoicGFzc3BvcnQifQ.demo", createdAt: new Date(now - 14400000).toISOString(), updatedAt: new Date(now - 7200000).toISOString() },
        { id: "visa_seed_003", uid: "eve@agency.io", type: "visa", status: "rejected", scopes: ["config:admin"], createdAt: new Date(now - 21600000).toISOString(), updatedAt: new Date(now - 10800000).toISOString() },
        { id: "visa_seed_004", uid: "frank@agency.io", type: "visa", status: "pending", scopes: ["api:write", "config:view"], createdAt: new Date(now - 3600000).toISOString(), updatedAt: new Date(now - 3600000).toISOString() },
      ];
      // Merge: don't overwrite existing apps
      const existing = getApps();
      const existingIds = new Set(existing.map(a => a.id));
      const merged = [...existing, ...demoApps.filter(a => !existingIds.has(a.id))];
      saveApps(merged);
      renderAll();
      showToast("Seeded " + (merged.length - existing.length) + " demo applications", "success");
    }

    document.getElementById("seedBtn").addEventListener("click", seedDemoData);

    // ===== Filter =====
    let filterText = "";
    document.getElementById("filterInput").addEventListener("input", (e) => {
      filterText = e.target.value.toLowerCase();
      renderTable();
    });

    // ===== Render =====
    function renderAll() {
      renderStats();
      renderTable();
    }

    function renderStats() {
      const apps = getApps();
      document.getElementById("statTotal").textContent = apps.length;
      document.getElementById("statPending").textContent = apps.filter(a => a.status === "pending").length;
      document.getElementById("statApproved").textContent = apps.filter(a => a.status === "approved" || a.status === "issued").length;
      document.getElementById("statRejected").textContent = apps.filter(a => a.status === "rejected").length;
    }

    function renderTable() {
      const tbody = document.getElementById("appTableBody");
      let apps = getApps();

      // Apply filter
      if (filterText) {
        apps = apps.filter(a =>
          a.id.toLowerCase().includes(filterText) ||
          a.uid.toLowerCase().includes(filterText) ||
          a.type.toLowerCase().includes(filterText) ||
          a.status.toLowerCase().includes(filterText) ||
          (a.fullName || "").toLowerCase().includes(filterText) ||
          (a.passportNumber || "").toLowerCase().includes(filterText) ||
          (a.scopes || []).join(" ").toLowerCase().includes(filterText)
        );
      }

      // Sort: newest first
      apps.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      if (apps.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-muted">// ' + (filterText ? 'no results matching filter' : 'registry empty — seed demo data or submit applications') + '</td></tr>';
        return;
      }

      tbody.innerHTML = apps.map((a) => `
        <tr class="border-b border-[#222233] hover:bg-[#16161e]">
          <td class="p-3 font-mono text-[11px] text-muted">${a.id.substring(0, 16)}</td>
          <td class="p-3 text-muted">${a.uid}</td>
          <td class="p-3 uppercase tracking-[1px] text-[11px]">${a.type}</td>
          <td class="p-3 text-[11px]">${a.type === "passport" ? (a.fullName + " / " + a.passportNumber + (a.token ? ' <span class="text-[#444]">[tok]</span>' : '')) : (a.scopes || []).join(", ")}</td>
          <td class="p-3"><span class="status-badge status-${a.status}">${a.status}</span></td>
          <td class="p-3 text-muted text-[11px]">${new Date(a.createdAt).toLocaleDateString()}</td>
          <td class="p-3 text-center">
            ${a.status === "pending" ? `
              <button class="btn btn-approve mr-1" data-id="${a.id}" data-action="approved">Approve</button>
              <button class="btn btn-reject" data-id="${a.id}" data-action="rejected">Reject</button>
            ` : '<span class="text-[10px] text-muted">—</span>'}
          </td>
        </tr>
      `).join("");

      // Wire up approve/reject buttons
      tbody.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const apps = getApps();
          const idx = apps.findIndex(a => a.id === id);
          if (idx === -1) return;
          const prevStatus = apps[idx].status;
          apps[idx].status = action;
          apps[idx].updatedAt = new Date().toISOString();
          saveApps(apps);
          renderAll();
          showToast(`app ${id.substring(0,10)}... ${prevStatus} → ${action}`, "success");

          try {
            await fetch("/api/update-status", {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id, status: action }),
            });
          } catch { /* offline ok */ }
        });
      });
    }

    document.getElementById("refreshBtn").addEventListener("click", renderAll);
  })();
  </script>
</body>
</html>
