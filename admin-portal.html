<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Agent MVP - Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body>
  <header style="padding:16px; background:white; border-bottom:1px solid #e5e7eb;">
    <h1 style="margin:0; font-size:1.25rem;">Passport Agent MVP - Admin Portal</h1>
  </header>
  <main style="padding:24px; max-width:1200px; margin:0 auto;">
    <section style="display:grid; grid-template-columns: repeat(4, 1fr); gap:16px;">
      <div style="background:white; padding:16px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.08);">
        <h3 style="font-size:12px; font-weight:700; color:#64748b;">Total Applications</h3>
        <div style="font-size:28px; font-weight:700;">1,240</div>
      </div>
      <div style="background:white; padding:16px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.08);">
        <h3 style="font-size:12px; font-weight:700; color:#64748b;">Pending Review</h3>
        <div style="font-size:28px; font-weight:700;">85</div>
      </div>
      <div style="background:white; padding:16px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.08);">
        <h3 style="font-size:12px; font-weight:700; color:#64748b;">Approved Today</h3>
        <div style="font-size:28px; font-weight:700;">42</div>
      </div>
      <div style="background:white; padding:16px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.08);">
        <h3 style="font-size:12px; font-weight:700; color:#64748b;">Urgent Issues</h3>
        <div style="font-size:28px; font-weight:700; color:#e11d48;">12</div>
      </div>
    </section>
    <section style="margin-top:20px; background:white; padding:24px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.08);">
      <h3>Recent Activities</h3>
      <p style="color:#6b7280;">This area can render recent admin actions, logs, and system messages.</p>
    </section>
  </main>
</body>
</html>
