<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Passport Agent - AI-powered passport and visa issuance platform" />
  <title>Passport Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            neon:  "#00ff41",
            "neon-dim": "#00cc33",
            "neon-glow": "rgba(0,255,65,.15)",
            void:  "#0a0a0a",
            "void-raised": "#111118",
            surface: "#16161e",
            border: "#222233",
            muted: "#6b7280",
            error: "#ff4444",
            success: "#00ff41",
          },
          fontFamily: { sans: ["JetBrains Mono", "monospace"], mono: ["JetBrains Mono", "monospace"] },
        },
      },
    };
  </script>

  <style>
    * { font-family: "JetBrains Mono", monospace; }
    body {
      background: #0a0a0a;
      color: #c0c0cc;
      min-height: 100vh;
    }

    /* Scan line overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,.015) 2px, rgba(0,255,65,.015) 3px);
      pointer-events: none;
      z-index: 9999;
    }

    /* Glow keyframes */
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 4px rgba(0,255,65,.2), 0 0 12px rgba(0,255,65,.05); }
      50%      { box-shadow: 0 0 8px rgba(0,255,65,.35), 0 0 20px rgba(0,255,65,.1); }
    }
    @keyframes text-glow {
      0%, 100% { text-shadow: 0 0 4px rgba(0,255,65,.4); }
      50%      { text-shadow: 0 0 10px rgba(0,255,65,.7); }
    }
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Cards */
    .card {
      background: #111118;
      border: 1px solid #222233;
      border-radius: 4px;
      padding: 24px;
      margin-bottom: 16px;
      animation: slide-in .3s ease;
      transition: border-color .2s;
    }
    .card:hover { border-color: rgba(0,255,65,.25); }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: "JetBrains Mono", monospace;
    }
    .btn-primary {
      background: rgba(0,255,65,.1);
      color: #00ff41;
      border-color: rgba(0,255,65,.3);
    }
    .btn-primary:hover:not(:disabled) {
      background: rgba(0,255,65,.2);
      box-shadow: 0 0 12px rgba(0,255,65,.25);
    }
    .btn-primary:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: transparent;
      color: #888;
      border-color: #333;
    }
    .btn-secondary:hover {
      color: #ccc;
      border-color: #555;
    }
    .btn-danger {
      background: rgba(255,68,68,.1);
      color: #ff4444;
      border-color: rgba(255,68,68,.3);
    }
    .btn-danger:hover {
      background: rgba(255,68,68,.2);
      box-shadow: 0 0 12px rgba(255,68,68,.25);
    }

    /* Inputs */
    .input {
      width: 100%;
      padding: 10px 14px;
      background: #0d0d15;
      border: 1px solid #333;
      border-radius: 3px;
      font-size: 13px;
      color: #c0c0cc;
      font-family: "JetBrains Mono", monospace;
      transition: border-color .15s;
    }
    .input:focus {
      outline: none;
      border-color: #00ff41;
      box-shadow: 0 0 8px rgba(0,255,65,.1);
    }
    .input::placeholder { color: #444; }
    .input-error { border-color: #ff4444; }

    /* Chips */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      font-family: "JetBrains Mono", monospace;
      border: 1px solid #333;
      background: #111118;
      color: #888;
      cursor: pointer;
      user-select: none;
      transition: all .12s ease;
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
    }
    .chip:hover { border-color: #00ff41; color: #00ff41; }
    .chip.selected {
      border-color: #00ff41;
      background: rgba(0,255,65,.08);
      color: #00ff41;
      box-shadow: 0 0 8px rgba(0,255,65,.15);
    }
    .chip:focus-visible { outline: 2px solid #00ff41; outline-offset: 2px; }

    /* Status badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-family: "JetBrains Mono", monospace;
    }
    .status-pending {
      background: rgba(255,196,0,.1);
      color: #ffc400;
      border: 1px solid rgba(255,196,0,.2);
    }
    .status-issued {
      background: rgba(0,255,65,.1);
      color: #00ff41;
      border: 1px solid rgba(0,255,65,.2);
    }
    .status-approved {
      background: rgba(0,200,255,.1);
      color: #00c8ff;
      border: 1px solid rgba(0,200,255,.2);
    }
    .status-rejected {
      background: rgba(255,68,68,.1);
      color: #ff4444;
      border: 1px solid rgba(255,68,68,.2);
    }
    .status-error {
      background: rgba(255,68,68,.1);
      color: #ff4444;
      border: 1px solid rgba(255,68,68,.2);
    }

    /* Spinner */
    .spinner { animation: spin 1s linear infinite; }

    /* Terminal-style prompt */
    .prompt::before {
      content: ">";
      color: #00ff41;
      margin-right: 8px;
      animation: cursor-blink 1.2s step-end infinite;
    }

    /* Section title */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ff41;
      margin-bottom: 12px;
      animation: text-glow 3s ease-in-out infinite;
    }

    .section-title::before {
      content: "// ";
      color: #444;
    }
  </style>
</head>
<body>
  <!-- Gate Overlay -->
  <div id="gate" class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,.85);">
    <div class="w-full max-w-sm bg-[#111118] border border-[#222233] p-8" style="box-shadow:0 0 40px rgba(0,255,65,.05);">
      <div class="text-center mb-6">
        <div class="text-neon text-3xl mb-2" style="animation: text-glow 3s ease-in-out infinite;">[ ]</div>
        <h2 class="text-sm font-bold uppercase tracking-[4px] text-neon mb-1" style="animation: text-glow 3s ease-in-out infinite;">Passport Agent</h2>
        <p class="text-xs text-muted">v2.0 // secure terminal</p>
      </div>
      <div class="mb-4">
        <label for="gateInput" class="block text-[10px] text-muted uppercase tracking-[2px] mb-2">Access Code</label>
        <input id="gateInput" type="password" placeholder="Enter code..." class="input" />
      </div>
      <button id="gateBtn" class="btn btn-primary w-full" disabled>Authenticate</button>
      <p id="gateError" class="text-xs text-error mt-3 text-center hidden">ACCESS DENIED</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <div id="authed">
      <header class="bg-[#0d0d15] border-b border-[#222233] sticky top-0 z-40">
        <div id="headerRow" class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
          <div>
            <h1 class="text-sm font-bold uppercase tracking-[4px] text-neon" style="animation: text-glow 3s ease-in-out infinite;">Passport Agent</h1>
            <p id="userDisplay" class="text-[10px] text-muted tracking-[2px] mt-0.5"></p>
          </div>
        </div>
      </header>

      <!-- Login / Register -->
      <div id="authView" class="max-w-md mx-auto mt-16 p-6">
        <div class="card" style="animation: glow-pulse 4s ease-in-out infinite;">
          <h2 id="authTitle" class="section-title">Sign In</h2>
          <div id="authFields">
            <label class="block text-[10px] uppercase tracking-[2px] text-muted mb-1">Email</label>
            <input id="authEmail" type="email" class="input mb-3" placeholder="you@example.com" required />
            <label class="block text-[10px] uppercase tracking-[2px] text-muted mb-1">Password</label>
            <input id="authPassword" type="password" class="input mb-4" placeholder="••••••••" required />
            <button id="authSubmitBtn" class="btn btn-primary w-full mb-2">Sign In</button>
            <p id="authError" class="text-xs text-error text-center hidden"></p>
          </div>
          <div class="text-xs text-center text-muted mt-4 border-t border-[#222233] pt-4">
            <span id="authToggleText">Don't have an account?</span>
            <button id="authToggleBtn" class="text-neon font-semibold underline ml-1">Create one</button>
          </div>
        </div>
      </div>

      <!-- Dashboard -->
      <div id="dashboardView" class="hidden">
        <main class="max-w-5xl mx-auto p-6 space-y-6">
          <!-- Create Visa -->
          <div class="card">
            <h3 class="section-title">Apply for Visa</h3>
            <p class="text-xs text-muted mb-4">Select authorization scopes for the target system.</p>
            <div id="scopeChips" class="flex flex-wrap gap-2 mb-4"></div>
            <button id="applyVisaBtn" class="btn btn-primary" disabled>Submit Visa Request</button>
            <p id="visaResult" class="text-xs mt-3 hidden"></p>
            <div id="visaSpinner" class="hidden mt-2 text-xs text-muted">
              <svg class="spinner inline w-3.5 h-3.5 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4z"/></svg>
              Processing request...
            </div>
          </div>

          <!-- Create Passport -->
          <div class="card">
            <h3 class="section-title">Issue Passport</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-[10px] uppercase tracking-[2px] text-muted mb-1">Full Name</label>
                <input id="fullNameInput" class="input" placeholder="Full legal name" />
              </div>
              <div>
                <label class="block text-[10px] uppercase tracking-[2px] text-muted mb-1">Passport Number</label>
                <input id="passportNumInput" class="input" placeholder="PS789012" />
              </div>
            </div>
            <button id="issuePassportBtn" class="btn btn-primary" disabled>Issue Passport</button>
            <p id="passportResult" class="text-xs mt-3 hidden"></p>
            <div id="passportSpinner" class="hidden mt-2 text-xs text-muted">
              <svg class="spinner inline w-3.5 h-3.5 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4z"/></svg>
              Issuing passport...
            </div>
          </div>

          <!-- Pending Applications -->
          <div class="card" id="applicationsSection">
            <h3 class="section-title">Active Sessions</h3>
            <div id="appList"><p class="text-xs text-muted prompt">Loading session data...</p></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script>
  (function() {
    const GATE_CODE = "Thegreatwave";
    const gate = document.getElementById("gate");
    const gateInput = document.getElementById("gateInput");
    const gateBtn = document.getElementById("gateBtn");
    const gateError = document.getElementById("gateError");
    const app = document.getElementById("app");

    // ===== Gate Logic =====
    function checkGateCookie() {
      return document.cookie.split(";").some(c => c.trim().startsWith("gate=true"));
    }

    if (checkGateCookie()) {
      gate.style.display = "none";
      app.classList.remove("hidden");
    }

    gateInput.addEventListener("input", () => {
      gateBtn.disabled = gateInput.value.length === 0;
    });

    gateBtn.addEventListener("click", () => {
      if (gateInput.value === GATE_CODE) {
        document.cookie = "gate=true; path=/; max-age=" + (365 * 24 * 60 * 60);
        gate.style.display = "none";
        app.classList.remove("hidden");
        gateError.classList.add("hidden");
      } else {
        gateError.classList.remove("hidden");
      }
    });

gateInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !gateBtn.disabled) gateBtn.click();
    });

    // ===== Auth (localStorage-based, no Firebase) =====
    let currentUser = JSON.parse(localStorage.getItem("passport_user") || "null");

    const authView = document.getElementById("authView");
    const dashboardView = document.getElementById("dashboardView");
    const authTitle = document.getElementById("authTitle");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authSubmitBtn = document.getElementById("authSubmitBtn");
    const authError = document.getElementById("authError");
    const authToggleBtn = document.getElementById("authToggleBtn");
    const authToggleText = document.getElementById("authToggleText");
    let authMode = "login"; // "login" or "register"

    function updateAuthUI() {
      if (authMode === "login") {
        authTitle.textContent = "Sign In";
        authSubmitBtn.textContent = "Sign In";
        authToggleText.textContent = "Don't have an account?";
        authToggleBtn.textContent = "Create one";
      } else {
        authTitle.textContent = "Create Account";
        authSubmitBtn.textContent = "Create Account";
        authToggleText.textContent = "Already have an account?";
        authToggleBtn.textContent = "Sign in";
      }
      authError.classList.add("hidden");
    }

    authToggleBtn.addEventListener("click", () => {
      authMode = authMode === "login" ? "register" : "login";
      updateAuthUI();
    });

    function saveUser(user) {
      currentUser = user;
      localStorage.setItem("passport_user", JSON.stringify(user));
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem("passport_users") || "{}");
    }

    function saveUsers(users) {
      localStorage.setItem("passport_users", JSON.stringify(users));
    }

    authSubmitBtn.addEventListener("click", () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      authError.classList.add("hidden");

      if (!email || !password) {
        authError.textContent = "Email and password are required.";
        authError.classList.remove("hidden");
        return;
      }

      const users = getUsers();

      if (authMode === "register") {
        if (users[email]) {
          authError.textContent = "An account with this email already exists.";
          authError.classList.remove("hidden");
          return;
        }
        users[email] = { email, password };
        saveUsers(users);
        saveUser({ email });
        showDashboard();
      } else {
        const stored = users[email];
        if (!stored || stored.password !== password) {
          authError.textContent = "Invalid email or password.";
          authError.classList.remove("hidden");
          return;
        }
        saveUser({ email });
        showDashboard();
      }
    });

    authPassword.addEventListener("keydown", (e) => {
      if (e.key === "Enter") authSubmitBtn.click();
    });

    function showDashboard() {
      authView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
      document.getElementById("userDisplay").textContent = currentUser?.email || "";
      loadApplications();
    }

    function logout() {
      localStorage.removeItem("passport_user");
      currentUser = null;
      authView.classList.remove("hidden");
      dashboardView.classList.add("hidden");
      document.getElementById("userDisplay").textContent = "";
      authEmail.value = "";
      authPassword.value = "";
      updateAuthUI();
    }

    // Show dashboard if already logged in
    if (currentUser) {
      showDashboard();
    }

    // Add sign out and admin link to header
    const userDisplay = document.getElementById("userDisplay");
    if (currentUser) userDisplay.textContent = currentUser.email;
    const headerRow = document.getElementById("headerRow");

    const adminLink = document.createElement("a");
    adminLink.href = "/admin-portal.html";
    adminLink.className = "text-[10px] text-muted uppercase tracking-[2px] hover:text-neon transition-colors";
    adminLink.textContent = "Admin";
    headerRow.appendChild(adminLink);

    const signOutBtn = document.createElement("button");
    signOutBtn.className = "btn btn-danger text-sm";
    signOutBtn.textContent = "Sign Out";
    signOutBtn.addEventListener("click", logout);
    headerRow.appendChild(signOutBtn);

    // ===== Application Storage (localStorage) =====
    function getApps() {
      return JSON.parse(localStorage.getItem("passport_apps") || "[]");
    }
    function saveApps(apps) {
      localStorage.setItem("passport_apps", JSON.stringify(apps));
    }
    function getUserId() {
      return currentUser?.email || "demo_user";
    }

    // ===== Scope Chips =====
    const SCOPE_OPTIONS = [
      { value: "api:read", label: "API Read" },
      { value: "api:write", label: "API Write" },
      { value: "data:share", label: "Data Share" },
      { value: "config:view", label: "Config View" },
      { value: "config:admin", label: "Config Admin" },
    ];

    const scopeContainer = document.getElementById("scopeChips");
    const selectedScopes = new Set();

    SCOPE_OPTIONS.forEach((s) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = s.label;
      chip.dataset.value = s.value;
      chip.tabIndex = 0;
      chip.setAttribute("role", "checkbox");
      chip.setAttribute("aria-checked", "false");

      const toggleChip = () => {
        const isSelected = selectedScopes.has(s.value);
        if (isSelected) {
          selectedScopes.delete(s.value);
          chip.classList.remove("selected");
          chip.setAttribute("aria-checked", "false");
        } else {
          selectedScopes.add(s.value);
          chip.classList.add("selected");
          chip.setAttribute("aria-checked", "true");
        }
        document.getElementById("applyVisaBtn").disabled = selectedScopes.size === 0;
      };

      chip.addEventListener("click", toggleChip);
      chip.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          toggleChip();
        }
      });
      scopeContainer.appendChild(chip);
    });

    // ===== Visa Application =====
    document.getElementById("applyVisaBtn").addEventListener("click", async () => {
      const resultEl = document.getElementById("visaResult");
      const spinnerEl = document.getElementById("visaSpinner");
      resultEl.classList.add("hidden");
      spinnerEl.classList.remove("hidden");

      try {
        const payload = { scopes: Array.from(selectedScopes), uid: getUserId() };

        let response;
        try {
          const res = await fetch("/api/apply-visa", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          response = await res.json();
        } catch {
          response = { success: true, message: "Visa request submitted", applicationId: `visa_${Date.now()}` };
        }

        // Persist to localStorage
        const apps = getApps();
        apps.push({
          id: response.applicationId || `visa_${Date.now()}`,
          uid: getUserId(),
          type: "visa",
          status: "pending",
          scopes: Array.from(selectedScopes),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
        saveApps(apps);

        resultEl.textContent = response.message || "Visa request submitted.";
        resultEl.className = "text-xs mt-3 text-neon";
        resultEl.classList.remove("hidden");
        loadApplications();
      } catch (err) {
        resultEl.textContent = "ERR: " + err.message;
        resultEl.className = "text-xs mt-3 text-error";
        resultEl.classList.remove("hidden");
      } finally {
        spinnerEl.classList.add("hidden");
      }
    });

    // ===== Passport Issuance =====
    const fullNameInput = document.getElementById("fullNameInput");
    const passportNumInput = document.getElementById("passportNumInput");
    const issuePassportBtn = document.getElementById("issuePassportBtn");

    function togglePassportBtn() {
      issuePassportBtn.disabled = !fullNameInput.value.trim() || !passportNumInput.value.trim();
    }
    fullNameInput.addEventListener("input", togglePassportBtn);
    passportNumInput.addEventListener("input", togglePassportBtn);

    issuePassportBtn.addEventListener("click", async () => {
      const resultEl = document.getElementById("passportResult");
      const spinnerEl = document.getElementById("passportSpinner");
      resultEl.classList.add("hidden");
      spinnerEl.classList.remove("hidden");

      try {
        const payload = {
          fullName: fullNameInput.value.trim(),
          passportNumber: passportNumInput.value.trim().toUpperCase(),
          uid: getUserId(),
        };

        let response;
        try {
          const res = await fetch("/api/apply-passport", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          response = await res.json();
        } catch {
          response = { success: true, message: "Passport issued", passport: { id: `pass_${Date.now()}`, token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyIiwiYXBwIjoicGFzc3BvcnQiLCJpc3MiOiJwYXNzcG9ydC1hZ2VudCJ9.demo_sig" } };
        }

        // Persist to localStorage
        const apps = getApps();
        apps.push({
          id: response.passport?.id || `pass_${Date.now()}`,
          uid: getUserId(),
          type: "passport",
          status: "issued",
          fullName: payload.fullName,
          passportNumber: payload.passportNumber,
          token: response.passport?.token || null,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
        saveApps(apps);

        resultEl.innerHTML = (response.message || "Passport issued.") +
          (response.passport?.token ? '<br><span class="text-[#444] text-[10px] font-mono break-all mt-1 block">token: ' + response.passport.token.substring(0, 60) + '...</span>' : '');
        resultEl.className = "text-xs mt-3 text-neon";
        resultEl.classList.remove("hidden");
        fullNameInput.value = "";
        passportNumInput.value = "";
        issuePassportBtn.disabled = true;
        loadApplications();
      } catch (err) {
        resultEl.textContent = "ERR: " + err.message;
        resultEl.className = "text-xs mt-3 text-error";
        resultEl.classList.remove("hidden");
      } finally {
        spinnerEl.classList.add("hidden");
      }
    });

    // ===== Load Applications =====
    async function loadApplications() {
      const container = document.getElementById("appList");
      try {
        // Primary: localStorage
        let data = getApps();

        // Merge with server data if available
        try {
          const res = await fetch(`/api/list-pending?uid=${encodeURIComponent(getUserId())}`);
          const json = await res.json();
          const serverApps = json.data || [];
          // Merge: server apps overwrite local ones with matching IDs
          const localMap = new Map(data.map(a => [a.id, a]));
          serverApps.forEach(a => localMap.set(a.id, a));
          data = Array.from(localMap.values());
          saveApps(data);
        } catch { /* offline, use localStorage only */ }

        if (data.length === 0) {
          container.innerHTML = '<p class="text-xs text-muted prompt">No active sessions. Submit a visa or passport request to begin.</p>';
          return;
        }

        container.innerHTML = data
          .map(
            (a) => `
          <div class="flex items-center justify-between py-3 border-b border-[#222233]">
            <div class="flex items-center gap-3">
              <span class="text-sm text-muted">${a.type === "visa" ? "visa:" : "pprt:"}</span>
              <div>
                <p class="text-xs font-semibold text-[#c0c0cc]">${a.type === "passport" ? a.fullName : "VISA-" + a.id}</p>
                <p class="text-[10px] text-muted tracking-[1px] uppercase">${a.type === "visa" ? "SCOPES: " + (a.scopes || []).join(", ") : "PASSPORT #" + a.passportNumber}</p>
              </div>
            </div>
            <span class="status-badge status-${a.status}">${a.status}</span>
          </div>`
          )
          .join("");
      } catch (err) {
        container.innerHTML = '<p class="text-xs text-error">CONNECTION FAILED: unable to load sessions.</p>';
      }
    }
  })();
  </script>
</body>
</html>
