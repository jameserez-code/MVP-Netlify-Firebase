<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Agent MVP - Admin Portal</title>
  <meta name="description" content="Passport Agent MVP - Admin Portal" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Arial; background: #f7f7f7; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-white border-b border-gray-200 p-4 shadow-sm">
    <h1 class="text-xl font-bold">Passport Agent MVP - Admin Portal</h1>
  </header>
  <main class="p-6">
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="bg-white p-4 rounded-lg shadow-sm border">
        <h2 class="text-sm font-semibold text-gray-600">Total Applications</h2>
        <p class="text-2xl font-bold">1,240</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border">
        <h2 class="text-sm font-semibold text-gray-600">Pending Review</h2>
        <p class="text-2xl font-bold">85</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border">
        <h2 class="text-sm font-semibold text-gray-600">Approved Today</h2>
        <p class="text-2xl font-bold">42</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border">
        <h2 class="text-sm font-semibold text-gray-600">Urgent Issues</h2>
        <p class="text-2xl font-bold text-red-600">12</p>
      </div>
    </section>
    <section class="mt-6 bg-white p-6 rounded-lg shadow-sm border">
      <h3 class="text-lg font-bold mb-4">Recent Activities</h3>
      <p class="text-sm text-gray-600">This area can render recent admin actions, logs, and system messages.</p>
    </section>
  </main>
  <footer class="p-4 text-center text-xs text-gray-500">Demo portal — private surface</footer>
</body>
</html>
