<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passport Agent - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <style>
    body { font-family: "Inter", system-ui, sans-serif; }
    .stat-card { padding: 20px; border-radius: 12px; background: #fff; border: 1px solid #e5e7eb; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  </style>
</head>
<body class="min-h-screen" style="background:#f7f7f7;">
  <div id="gate" class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,.55);">
    <div class="w-full max-w-sm bg-white rounded-xl p-8 shadow-2xl">
      <h2 class="text-xl font-bold mb-2 text-center">Admin Access</h2>
      <p class="text-sm text-gray-500 text-center mb-6">Enter admin code</p>
      <input id="gateInput" type="password" placeholder="Admin code" class="w-full p-3 border rounded-lg mb-3" />
      <button id="gateBtn" class="w-full p-3 bg-blue-600 text-white rounded-lg font-semibold" disabled>Unlock</button>
      <p id="gateError" class="text-xs text-red-600 mt-3 text-center hidden">Incorrect code.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <div id="loginView" class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg text-center">
        <h2 class="text-xl font-bold mb-1">Admin Sign In</h2>
        <p class="text-sm text-gray-500 mb-8">Sign in with Google to access the dashboard</p>

        <button id="googleSignInBtn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-6 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <p id="loginError" class="text-sm text-red-600 mt-4 hidden"></p>
      </div>
    </div>

    <div id="dashboard" class="hidden">
      <header class="bg-white border-b sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
          <div>
            <h1 class="text-lg font-bold">Passport Agent</h1>
            <p class="text-xs text-gray-500">Admin Dashboard</p>
          </div>
          <div class="flex items-center gap-4">
            <span id="adminUser" class="text-sm text-gray-600"></span>
            <button id="signOutBtn" class="text-sm px-4 py-2 bg-gray-100 rounded-lg">Sign Out</button>
          </div>
        </div>
      </header>

      <main class="max-w-6xl mx-auto p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="stat-card"><h3 class="text-xs font-semibold text-gray-500 uppercase mb-1">Total Applications</h3><p id="statTotal" class="text-3xl font-bold">---</p></div>
          <div class="stat-card"><h3 class="text-xs font-semibold text-gray-500 uppercase mb-1">Pending Review</h3><p id="statPending" class="text-3xl font-bold text-amber-600">---</p></div>
          <div class="stat-card"><h3 class="text-xs font-semibold text-gray-500 uppercase mb-1">Issued Passports</h3><p id="statIssued" class="text-3xl font-bold text-green-600">---</p></div>
          <div class="stat-card"><h3 class="text-xs font-semibold text-gray-500 uppercase mb-1">Active Visas</h3><p id="statVisas" class="text-3xl font-bold text-blue-600">---</p></div>
        </div>

        <div class="bg-white rounded-xl p-6 border shadow-sm">
          <h3 class="text-base font-bold mb-4">Recent Applications</h3>
          <div id="appTable" class="overflow-x-auto"><p class="text-sm text-gray-400">Loading...</p></div>
        </div>
      </main>
    </div>
  </div>

  <script>
  (function() {
    const GATE_CODE = "Thegreatwave";
    const gate = document.getElementById("gate");
    const gateInput = document.getElementById("gateInput");
    const gateBtn = document.getElementById("gateBtn");
    const gateError = document.getElementById("gateError");
    const app = document.getElementById("app");

    // No persistence for admin gate as per request
    gateInput.addEventListener("input", () => { gateBtn.disabled = !gateInput.value; });
    gateBtn.addEventListener("click", () => {
      if (gateInput.value === GATE_CODE) {
        gate.style.display = "none";
        app.classList.remove("hidden");
      } else { gateError.classList.remove("hidden"); }
    });

    const firebaseConfig = {
      apiKey: window.FIREBASE_API_KEY || "YOUR_API_KEY",
      authDomain: window.FIREBASE_AUTH_DOMAIN || "YOUR_PROJECT.firebaseapp.com",
      projectId: window.FIREBASE_PROJECT_ID || "YOUR_PROJECT_ID",
      storageBucket: window.FIREBASE_STORAGE_BUCKET || "YOUR_PROJECT.appspot.com",
      messagingSenderId: window.FIREBASE_MESSAGING_SENDER_ID || "YOUR_SENDER_ID",
      appId: window.FIREBASE_APP_ID || "YOUR_APP_ID",
    };

    let auth, db;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) { console.warn("Firebase demo mode:", e.message); }

    document.getElementById("googleSignInBtn").addEventListener("click", async () => {
      const errEl = document.getElementById("loginError");
      errEl.classList.add("hidden");
      try {
        if (auth) {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
        } else {
          throw new Error("Firebase auth not initialized");
        }
      } catch (err) { errEl.textContent = err.message; errEl.classList.remove("hidden"); }
    });

    document.getElementById("signOutBtn").addEventListener("click", () => { if (auth) auth.signOut(); });

    if (auth) {
      auth.onAuthStateChanged((user) => {
        document.getElementById("loginView").classList.toggle("hidden", !!user);
        document.getElementById("dashboard").classList.toggle("hidden", !user);
        if (user) {
          document.getElementById("adminUser").textContent = user.email;
          loadStats();
          loadApplications();
        }
      });
    }

    async function loadStats() {
      try {
        const res = await fetch("/api/list-pending");
        const json = await res.json();
        const apps = json.data || [];
        document.getElementById("statTotal").textContent = apps.length;
        document.getElementById("statPending").textContent = apps.filter(a => a.status === "pending").length;
        document.getElementById("statIssued").textContent = apps.filter(a => a.status === "issued").length;
        document.getElementById("statVisas").textContent = apps.filter(a => a.type === "visa").length;
      } catch {
        document.getElementById("statTotal").textContent = "---";
      }
    }

    async function loadApplications() {
      const container = document.getElementById("appTable");
      try {
        const res = await fetch("/api/list-pending");
        const json = await res.json();
        const apps = json.data || [];
        if (!apps.length) { container.innerHTML = '<p class="text-sm text-gray-400">No applications found.</p>'; return; }
        container.innerHTML = `<table class="w-full text-sm"><thead class="bg-gray-50"><tr>
          <th class="p-3 text-left">ID</th><th class="p-3 text-left">Type</th><th class="p-3 text-left">Details</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Date</th></tr></thead><tbody class="divide-y">`
          + apps.map(a => `<tr><td class="p-3 text-xs font-mono">${a.id}</td>
            <td class="p-3">${a.type === "passport" ? "📕 Passport" : "🛂 Visa"}</td>
            <td class="p-3">${a.type === "passport" ? a.fullName : (a.scopes||[]).join(", ")}</td>
            <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${a.status==='issued'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}">${a.status}</span></td>
            <td class="p-3 text-gray-500">${new Date(a.createdAt).toLocaleDateString()}</td></tr>`).join("")
          + "</tbody></table>";
      } catch { container.innerHTML = '<p class="text-sm text-red-500">Error loading applications.</p>'; }
    }
  })();
  </script>
</body>
</html>
