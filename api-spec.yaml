{
  "openapi": "3.0.3",
  "info": {
    "title": "Passport Agent — Agent Control Plane API",
    "version": "2.1.0",
    "description": "AI agent identity + permission enforcement API. 15 endpoints for agent lifecycle management, task execution, policy enforcement, and observability."
  },
  "servers": [{ "url": "http://localhost:3000", "description": "Local development" }],
  "paths": {
    "/auth/login": {
      "post": {
        "summary": "Authenticate and get JWT token",
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "email": { "type": "string" }, "password": { "type": "string" } }, "required": ["email","password"] } } } },
        "responses": { "200": { "description": "JWT token + user info" }, "401": { "description": "Invalid credentials" } }
      }
    },
    "/task": {
      "post": {
        "summary": "Create a task",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "payload": { "type": "object" } }, "required": ["payload"] } } } },
        "responses": { "201": { "description": "Task created" }, "401": { "description": "Unauthorized" } }
      }
    },
    "/task/{id}": {
      "get": {
        "summary": "Get task by ID",
        "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string" } }],
        "responses": { "200": { "description": "Task document" }, "404": { "description": "Not found" } }
      }
    },
    "/agent/run": {
      "post": {
        "summary": "Start an agent run on a task",
        "security": [{ "bearerAuth": [] }],
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "agentId": { "type": "string" }, "taskId": { "type": "string" } }, "required": ["agentId","taskId"] } } } },
        "responses": { "201": { "description": "Run started" }, "400": { "description": "Validation error" }, "409": { "description": "Invalid state transition" } }
      }
    },
    "/run/{id}/log": {
      "post": {
        "summary": "Log an agent action during a run",
        "security": [{ "bearerAuth": [] }],
        "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string" } }],
        "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "tool": { "type": "string" }, "decision": { "type": "string", "enum": ["allow","deny","modify"] }, "parameters": { "type": "object" }, "reason": { "type": "string" } }, "required": ["tool","decision"] } } } },
        "responses": { "201": { "description": "Action logged" } }
      }
    },
    "/run/{id}/complete": {
      "patch": { "summary": "Complete a run", "security": [{ "bearerAuth": [] }], "parameters": [{ "name": "id", "in": "path", "required": true }], "responses": { "200": { "description": "Run completed" }, "409": { "description": "Invalid transition" } } }
    },
    "/run/{id}/fail": {
      "patch": { "summary": "Fail a run", "security": [{ "bearerAuth": [] }], "parameters": [{ "name": "id", "in": "path", "required": true }], "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "error": { "type": "string" } } } } } }, "responses": { "200": { "description": "Run failed" } } }
    },
    "/agents/register": {
      "post": { "summary": "Register a new agent", "security": [{ "bearerAuth": [] }], "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "name": { "type": "string" }, "model": { "type": "string" }, "provider": { "type": "string" }, "systemPrompt": { "type": "string" } }, "required": ["name","model","provider"] } } } }, "responses": { "201": { "description": "Agent registered with secret key" } } }
    },
    "/agents": {
      "get": { "summary": "List agents", "responses": { "200": { "description": "Array of agents" } } }
    },
    "/agents/{id}": {
      "get": { "summary": "Get agent by ID", "parameters": [{ "name": "id", "in": "path", "required": true }], "responses": { "200": { "description": "Agent document" }, "404": { "description": "Not found" } } },
      "patch": { "summary": "Revoke agent", "security": [{ "bearerAuth": [] }], "parameters": [{ "name": "id", "in": "path", "required": true }], "responses": { "200": { "description": "Agent revoked" } } }
    },
    "/policies": {
      "post": { "summary": "Create policy", "security": [{ "bearerAuth": [] }], "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "name": { "type": "string" }, "rules": { "type": "object" } }, "required": ["name","rules"] } } } }, "responses": { "201": { "description": "Policy created" } } },
      "get": { "summary": "List policies", "responses": { "200": { "description": "Array of policies" } } }
    },
    "/enforce": {
      "post": { "summary": "Evaluate agent intent against policies", "security": [{ "bearerAuth": [] }], "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "intent": { "type": "object", "properties": { "intentId": { "type": "string" }, "agentId": { "type": "string" }, "tool": { "type": "string" }, "parameters": { "type": "object" } }, "required": ["intentId","agentId","tool"] } } } } } }, "responses": { "200": { "description": "Enforcement decision + gateway ticket" } } }
    },
    "/gateway/execute": {
      "post": { "summary": "Execute tool via gateway ticket", "requestBody": { "content": { "application/json": { "schema": { "type": "object", "properties": { "gatewayTicket": { "type": "string" }, "action": { "type": "object" } }, "required": ["gatewayTicket","action"] } } } }, "responses": { "200": { "description": "Executed" }, "403": { "description": "Invalid/replayed ticket" } } }
    },
    "/audit": {
      "get": { "summary": "Query action intents", "parameters": [{ "name": "decision", "in": "query" }, { "name": "limit", "in": "query" }], "responses": { "200": { "description": "Audit log" } } }
    },
    "/audit/timeline": {
      "get": { "summary": "Execution timeline", "responses": { "200": { "description": "Chronological event history" } } }
    },
    "/run/{id}/trace": {
      "get": { "summary": "Full execution trace for a run", "parameters": [{ "name": "id", "in": "path", "required": true }], "responses": { "200": { "description": "Run + task + events" } } }
    },
    "/metrics": {
      "get": { "summary": "Operational metrics", "responses": { "200": { "description": "Task/run/agent counts + avg duration" } } }
    },
    "/security/ping": {
      "get": { "summary": "Auth status + org context", "responses": { "200": { "description": "Auth check" } } }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" }
    }
  }
}
